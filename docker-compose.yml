services:
  postgres:
    image: postgres:16
    container_name: spend-control-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spendcontrol}
      POSTGRES_USER: ${POSTGRES_USER:-spendcontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spendcontrol}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spendcontrol} -d ${POSTGRES_DB:-spendcontrol}"]
      interval: 10s
      timeout: 5s
      retries: 10

  platform-api:
    build:
      context: ./backend
    container_name: spend-control-platform-api
    environment:
      SERVICE_NAME: ${SERVICE_NAME:-platform-api}
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-spendcontrol}:${POSTGRES_PASSWORD:-spendcontrol}@postgres:5432/${POSTGRES_DB:-spendcontrol}}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      AUTH_MODE: ${AUTH_MODE:-dev-local}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      ENTRA_FRONTEND_CLIENT_ID: ${ENTRA_FRONTEND_CLIENT_ID:-}
      ENTRA_BACKEND_CLIENT_ID: ${ENTRA_BACKEND_CLIENT_ID:-}
      ENTRA_BACKEND_AUDIENCE: ${ENTRA_BACKEND_AUDIENCE:-}
      ENTRA_AUTHORITY: ${ENTRA_AUTHORITY:-}
      ENTRA_ALLOWED_TENANT_IDS: ${ENTRA_ALLOWED_TENANT_IDS:-}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      DEV_AUTH_SECRET: ${DEV_AUTH_SECRET:-dev-only-secret-change-me}
      DEV_AUTH_DEFAULT_EMAIL: ${DEV_AUTH_DEFAULT_EMAIL:-developer@local.test}
      DEV_AUTH_DEFAULT_NAME: ${DEV_AUTH_DEFAULT_NAME:-Local Developer}
      DEV_AUTH_DEFAULT_ROLE: ${DEV_AUTH_DEFAULT_ROLE:-org_admin}
      AZURE_AI_FOUNDRY_ENDPOINT: ${AZURE_AI_FOUNDRY_ENDPOINT:-}
      AZURE_AI_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT:-}
      AZURE_AI_MODEL_DEPLOYMENT: ${AZURE_AI_MODEL_DEPLOYMENT:-}
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:-}
      AZURE_STORAGE_ACCOUNT_URL: ${AZURE_STORAGE_ACCOUNT_URL:-}
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME:-}
      FINANCE_DEFAULT_CURRENCY: ${FINANCE_DEFAULT_CURRENCY:-INR}
      LOCAL_UPLOAD_DIR: /app/data/uploads
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-dev-local}
        NEXT_PUBLIC_ENTRA_FRONTEND_CLIENT_ID: ${NEXT_PUBLIC_ENTRA_FRONTEND_CLIENT_ID:-}
        NEXT_PUBLIC_ENTRA_BACKEND_CLIENT_ID: ${NEXT_PUBLIC_ENTRA_BACKEND_CLIENT_ID:-}
        NEXT_PUBLIC_ENTRA_API_SCOPE: ${NEXT_PUBLIC_ENTRA_API_SCOPE:-}
        NEXT_PUBLIC_ENTRA_AUTHORITY: ${NEXT_PUBLIC_ENTRA_AUTHORITY:-}
    container_name: spend-control-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-dev-local}
      NEXT_PUBLIC_ENTRA_FRONTEND_CLIENT_ID: ${NEXT_PUBLIC_ENTRA_FRONTEND_CLIENT_ID:-}
      NEXT_PUBLIC_ENTRA_BACKEND_CLIENT_ID: ${NEXT_PUBLIC_ENTRA_BACKEND_CLIENT_ID:-}
      NEXT_PUBLIC_ENTRA_API_SCOPE: ${NEXT_PUBLIC_ENTRA_API_SCOPE:-}
      NEXT_PUBLIC_ENTRA_AUTHORITY: ${NEXT_PUBLIC_ENTRA_AUTHORITY:-}
    ports:
      - "3000:3000"
    depends_on:
      - platform-api

volumes:
  postgres-data:
  backend-data:
