name: Terraform Dev

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/terraform-dev.yml"
      - "terraform/azure/aks/**"
      - "infra/helm/business-ai-app/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/terraform-dev.yml"
      - "terraform/azure/aks/**"
      - "infra/helm/business-ai-app/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  terraform-dev:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'terraform/')
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh
        working-directory: terraform/azure/aks

    env:
      ARM_CLIENT_ID: "f2423c6d-2f93-4369-8ed5-b0637b086dcc"
      ARM_TENANT_ID: "920e9322-340c-4fbc-bf09-dc8fd6636182"
      ARM_SUBSCRIPTION_ID: "e1f5b4be-e0ba-4ccb-8708-a949458fcd83"
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      TF_IN_AUTOMATION: "true"
      AZURE_CLI_DISABLE_CONNECTION_VERIFICATION: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Show tool versions
        run: |
          az version
          terraform version

      - name: Terraform init
        run: terraform init -reconfigure -backend-config=use_oidc=true -backend-config=use_azuread_auth=true

      - name: Select dev workspace
        run: terraform workspace select dev

      - name: Fetch AKS kubeconfig
        run: |
          $resourceGroup = (terraform output -raw resource_group_name).Trim()
          $clusterName = (terraform output -raw aks_cluster_name).Trim()
          az aks get-credentials --resource-group $resourceGroup --name $clusterName --admin --overwrite-existing --file .generated-kubeconfig

      - name: Terraform plan
        if: github.event_name == 'pull_request'
        run: terraform plan -var-file terraform.tfvars -var build_images_during_apply=false

      - name: Terraform apply
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: terraform apply -var-file terraform.tfvars -var build_images_during_apply=false -auto-approve
