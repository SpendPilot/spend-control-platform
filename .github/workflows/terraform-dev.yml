name: Terraform Dev

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/terraform-dev.yml"
      - "terraform/azure/aks/**"
      - "infra/helm/business-ai-app/**"
      - "backend/**"
      - "frontend/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/terraform-dev.yml"
      - "terraform/azure/aks/**"
      - "infra/helm/business-ai-app/**"
      - "backend/**"
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  terraform-dev:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'terraform/')
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh
        working-directory: terraform/azure/aks

    env:
      ARM_CLIENT_ID: "f2423c6d-2f93-4369-8ed5-b0637b086dcc"
      ARM_TENANT_ID: "920e9322-340c-4fbc-bf09-dc8fd6636182"
      ARM_SUBSCRIPTION_ID: "e1f5b4be-e0ba-4ccb-8708-a949458fcd83"
      TF_IN_AUTOMATION: "true"
      AZURE_CLI_DISABLE_CONNECTION_VERIFICATION: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Show tool versions
        run: |
          az version
          terraform version

      - name: Terraform plan
        if: github.event_name == 'pull_request'
        run: powershell -ExecutionPolicy Bypass -File .\dev-workspace.ps1 -Action plan -BuildImagesDuringApply

      - name: Terraform apply
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: powershell -ExecutionPolicy Bypass -File .\dev-workspace.ps1 -Action apply -AutoApprove -BuildImagesDuringApply
